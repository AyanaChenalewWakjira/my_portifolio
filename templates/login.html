{% extends 'base.html' %}

{% block title %}Admin Login | Ayana Chenalew{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-24">
    <div class="glass-card bg-gray-900/90 border border-gray-800 rounded-3xl p-8 md:p-10 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 mx-auto rounded-2xl bg-indigo-950 border border-indigo-800/60 flex items-center justify-center text-indigo-400 text-xl font-bold mb-2 shadow-inner">
                🔐
            </div>
            <h2 class="text-2xl font-black text-white">Admin Login</h2>
            <p class="text-xs text-gray-400">Sign in to manage your portfolio dashboard.</p>
        </div>
        
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1.5">Username</label>
                <input type="text" name="username" required placeholder="Enter username" 
                       class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1.5">Password</label>
                <input type="password" name="password" required placeholder="••••••••••••" 
                       class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl text-sm shadow-lg shadow-indigo-600/25 transition duration-200 flex items-center justify-center gap-2">
                <span>Sign In</span>
                <span>&rarr;</span>
            </button>
        </form>

    </div>
</div>
{% endblock %}
