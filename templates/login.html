{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-20">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-xl space-y-6">
        <h2 class="text-2xl font-bold text-center text-white">Admin Login</h2>
        
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                <input type="text" name="username" required 
                       class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-gray-200 focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" name="password" required 
                       class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-gray-200 focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition">
                Seeni (Login)
            </button>
        </form>
    </div>
</div>
{% endblock %}
